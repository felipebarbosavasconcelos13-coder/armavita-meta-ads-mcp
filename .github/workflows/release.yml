name: Release

# Builds ready-to-run binaries and publishes a GitHub Release when a tag such
# as `v2.0.0-rc.2-fb.1` is pushed. The tag must match the version in Cargo.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare tag and package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: ubuntu-24.04
            target: x86_64-pc-windows-gnu
            binary: armavita-meta-ads-mcp.exe
            archive: zip
          # Ubuntu 22.04 links against glibc 2.35, so the binary also runs on
          # Debian 12, Ubuntu 22.04 and newer.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: armavita-meta-ads-mcp
            archive: tar.gz
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: armavita-meta-ads-mcp
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install cross toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 cmake nasm
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="armavita-meta-ads-mcp-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${name}/"
          cp LICENSE README.md docs/INSTALACAO.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -qr "${name}.zip" "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          {
            echo "Binários prontos do fork armavita-meta-ads-mcp (Meta Marketing API v27)."
            echo
            echo "- Windows x64: \`*-windows-x64.zip\`"
            echo "- Linux x64 (glibc 2.35+): \`*-linux-x64.tar.gz\`"
            echo "- macOS Apple Silicon: \`*-macos-arm64.tar.gz\`"
            echo
            echo "Guia de instalação em português: [docs/INSTALACAO.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALACAO.md). Confira o download com \`SHA256SUMS\`."
            echo
            echo "Código-fonte desta versão: tag \`${GITHUB_REF_NAME}\` (AGPL-3.0-only)."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease}
